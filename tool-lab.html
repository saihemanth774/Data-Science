<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sai Hemanth's Coding Lab</title><link rel="stylesheet" href="script.css">
<script src="theme.js"></script></head><body><header class="sub-head"><h2>Sai Hemanth's <em>Coding Lab</em></h2><button class="btn btn-light" onclick="location.href='dashboard.html#labs'">← Lab Assignments</button></header><div class="lab-container"><h1 id="toolTitle">Python Editor</h1><p class="note">Write code, click Run Code, and check the output below. Runs in your browser.</p><div class="toolbar"><select id="language" onchange="changeLanguage()"><option value="python">Python</option><option value="numpy">NumPy</option><option value="pandas">Pandas</option><option value="matplotlib">Matplotlib</option><option value="sklearn">Scikit-learn</option></select><div><button class="btn btn-light" onclick="resetCode()">Reset</button> <button class="btn run" id="runButton" onclick="runCode()">▶ Run Code</button></div></div><textarea id="editor" spellcheck="false"></textarea><p id="status" class="status">Loading Python runtime...</p><div class="output-box"><h3>Output Console</h3><pre id="output">Your output will appear here...</pre><img id="plotOutput" alt="Generated chart"></div><p class="note">Internet is required to load Pyodide and libraries.</p></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script>
let pyodide=null,initialCode="";
const examples={python:'print("Welcome, Sai Hemanth!")\na = 10\nb = 20\nprint("Sum:", a + b)',numpy:'import numpy as np\nnumbers = np.array([10, 20, 30, 40])\nprint("Array:", numbers)\nprint("Mean:", np.mean(numbers))\nprint("Maximum:", np.max(numbers))',pandas:'import pandas as pd\ndata = {"Name": ["Ravi", "Priya", "Arjun"], "Marks": [85, 92, 78]}\ndf = pd.DataFrame(data)\nprint(df)\nprint("Average marks:", df["Marks"].mean())',matplotlib:'import matplotlib.pyplot as plt\nx = [1, 2, 3, 4, 5]\ny = [10, 20, 15, 30, 25]\nplt.plot(x, y, marker="o")\nplt.title("Sample Data Graph")\nplt.xlabel("X Values")\nplt.ylabel("Y Values")\nplt.grid(True)\nprint("Graph created.")',sklearn:'from sklearn.linear_model import LinearRegression\nX = [[1], [2], [3], [4], [5]]\ny = [10, 20, 30, 40, 50]\nmodel = LinearRegression().fit(X, y)\nprint("Prediction for 6:", model.predict([[6]])[0])'};
const titles={python:"Python Editor",numpy:"NumPy Lab",pandas:"Pandas Data Analysis Lab",matplotlib:"Matplotlib Visualization Lab",sklearn:"Machine Learning Lab"};
function clearPlot(){const p=document.getElementById("plotOutput");p.removeAttribute("src");p.style.display="none"}
function changeLanguage(){const l=document.getElementById("language").value;document.getElementById("toolTitle").textContent=titles[l];document.getElementById("editor").value=examples[l];initialCode=examples[l];document.getElementById("output").textContent="Click Run Code to see output.";clearPlot()}
async function loadRuntime(){try{pyodide=await loadPyodide();document.getElementById("status").textContent="Python runtime ready."}catch(e){document.getElementById("status").textContent="Runtime failed. Check your internet connection.";document.getElementById("output").textContent=String(e)}}
async function runCode(){const output=document.getElementById("output"),status=document.getElementById("status"),btn=document.getElementById("runButton");if(!pyodide){output.textContent="Python is still loading. Wait and try again.";return}const lang=document.getElementById("language").value;output.textContent="";clearPlot();status.textContent="Running code...";btn.disabled=true;
try{if(lang==="numpy")await pyodide.loadPackage("numpy");if(lang==="pandas")await pyodide.loadPackage(["numpy","pandas"]);if(lang==="matplotlib")await pyodide.loadPackage(["numpy","matplotlib"]);if(lang==="sklearn")await pyodide.loadPackage(["numpy","scipy","scikit-learn"]);
pyodide.globals.set("_user_code",document.getElementById("editor").value);
await pyodide.runPythonAsync("import sys\nfrom io import StringIO\n_oldout=sys.stdout\n_buf=StringIO()\nsys.stdout=_buf\ntry:\n exec(compile(_user_code, '<editor>', 'exec'))\nfinally:\n sys.stdout=_oldout\n_output_text=_buf.getvalue()\n_plot_created=False\nif 'matplotlib.pyplot' in sys.modules:\n import matplotlib.pyplot as _plt\n if _plt.gcf().get_axes():\n  _plt.gcf().savefig('/tmp/ds_plot.png',format='png',bbox_inches='tight')\n  _plot_created=True\n _plt.close('all')");
output.textContent=pyodide.globals.get("_output_text")||"Code executed without printed output.";
if(pyodide.globals.get("_plot_created")){const bytes=pyodide.FS.readFile("/tmp/ds_plot.png");let binary="";for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);const plot=document.getElementById("plotOutput");plot.src="data:image/png;base64,"+btoa(binary);plot.style.display="block"}status.textContent="Execution completed."}catch(e){output.textContent="ERROR:\n"+String(e);status.textContent="Execution failed. Check the error above."}finally{btn.disabled=false}}
function resetCode(){document.getElementById("editor").value=initialCode;document.getElementById("output").textContent="Code reset. Click Run Code.";clearPlot()}
const params=new URLSearchParams(location.search),requested=(params.get("tool")||"python").toLowerCase();document.getElementById("language").value=examples[requested]?requested:"python";changeLanguage();loadRuntime();
</script></body></html>
